<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yashu Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
    }

    .login-box {
      width: 360px;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Yashu</h1>
    <p class="subtitle">Sign in to your cloud storage</p>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>

      <p id="message"></p>
    </form>
  </div>

  <script>
    const USERNAME = "yashu22";
    const PASSWORD = "sujan22";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (username === USERNAME && password === PASSWORD) {
        message.style.color = "green";
        message.textContent = "Login successful!";

        // Save session
        localStorage.setItem("freecloud_auth_user", username);

        setTimeout(() => {
          // If in an iframe, redirect to root cloud storage
          if (window.self !== window.top) {
            window.location.href = "/";
          } else {
            window.location.href = "https://yashu-99.ai.studio";
          }
        }, 500);
      } else {
        message.style.color = "red";
        message.textContent = "Invalid username or password.";
      }
    });
  </script>

</body>
</html>
